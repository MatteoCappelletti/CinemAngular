<form class="search" role="search" (ngSubmit)="submit()">
  <label class="sr-only" for="search-input">Cerca film, serie TV e persone</label>
  <input
    id="search-input"
    type="search"
    name="q"
    placeholder="Cerca film, serie o persone…"
    autocomplete="off"
    [ngModel]="query()"
    (ngModelChange)="query.set($event)"
  />
  <button type="submit" aria-label="Cerca">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
  </button>
</form>
